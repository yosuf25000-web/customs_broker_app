name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      # يضمن وجود إذن الإنترنت دائماً، مهما حدث لأي نسخة قديمة من android/
      - name: Ensure INTERNET permission exists
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$FILE"; then
            sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.INTERNET" />' "$FILE"
          fi
          cat "$FILE"

      - run: flutter pub get

      - run: flutter analyze

      - name: Build APK with correct API URL
        run: flutter build apk --release --dart-define=API_BASE_URL=https://customsbackend-production.up.railway.app

      - name: Verify embedded URL and permission
        run: |
          mkdir -p /tmp/verify
          unzip -o build/app/outputs/flutter-apk/app-release.apk -d /tmp/verify > /dev/null
          echo "--- URL check ---"
          strings /tmp/verify/lib/arm64-v8a/libapp.so | grep -i "railway.app" || (echo "❌ URL missing!" && exit 1)
          echo "--- INTERNET permission check ---"
          python3 -c "
          data = open('/tmp/verify/AndroidManifest.xml','rb').read()
          ok = 'INTERNET' in data.decode('utf-16-le', errors='ignore')
          print('✅ INTERNET permission present' if ok else '❌ MISSING')
          exit(0 if ok else 1)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
